,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
:root{--paper:#EEF1F0;--sheet:#FAFBFA;--ink:#172033;--ink2:#4A5468;--rule:#C6CEC9;--rule2:#DDE3DF;--stamp:#3B3EA5;--stamp-bg:#E6E7F7;--on-stamp:#fff;--ok:#1F7A4D;--ok-bg:#E0F0E7;--warn:#8F5206;--warn-bg:#F8ECD3;--bad:#A8231C;--bad-bg:#F8E1DF;--info:#4A5468;--info-bg:#E3E8E6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121925;--sheet:#182130;--ink:#E6EAF2;--ink2:#A9B2C4;--rule:#334058;--rule2:#26314A;--stamp:#A7AAF7;--stamp-bg:#26295A;--on-stamp:#10142B;--ok:#5FC98F;--ok-bg:#183A2A;--warn:#E8AE55;--warn-bg:#40300F;--bad:#F58A81;--bad-bg:#4A1E1B;--info:#A9B2C4;--info-bg:#252F44;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121925;--sheet:#182130;--ink:#E6EAF2;--ink2:#A9B2C4;--rule:#334058;--rule2:#26314A;--stamp:#A7AAF7;--stamp-bg:#26295A;--on-stamp:#10142B;--ok:#5FC98F;--ok-bg:#183A2A;--warn:#E8AE55;--warn-bg:#40300F;--bad:#F58A81;--bad-bg:#4A1E1B;--info:#A9B2C4;--info-bg:#252F44;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 5rem);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 'Atkinson Hyperlegible',system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
a{color:var(--stamp)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--stamp);color:var(--on-stamp);padding:.5rem 1rem;z-index:50}
.skip:focus{left:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.9rem;padding:.65rem 1.1rem;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.search{flex:1;max-width:38rem}
.search input{width:100%;font:inherit;padding:.55rem .8rem;color:var(--ink);background:var(--sheet);border:2px solid var(--ink);border-radius:3px}
.search input::placeholder{color:var(--ink2);opacity:1}
.btn{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:3px;padding:.45rem .8rem;cursor:pointer}
.btn:hover{background:var(--rule2)}
.btn[aria-pressed="true"]{background:var(--stamp-bg);border-color:var(--stamp);color:var(--stamp);font-weight:700}
#menuBtn{display:none}
.shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr);max-width:92rem;margin:0 auto}
#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4rem);align-self:start;height:calc(100dvh - 4rem - env(safe-area-inset-top,0px));overflow:auto;padding:1rem .75rem 2rem 1.1rem;border-right:1px solid var(--rule)}
.ch{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:none;border:0;border-radius:2px;padding:.45rem .4rem;cursor:pointer}
.ch:hover{background:var(--rule2)}
.ct{color:var(--ink2);font-weight:400;font-size:.85rem;margin-left:.5rem}
#nav ul{list-style:none;margin:0 0 .5rem .5rem;padding:0 0 0 .6rem;border-left:2px solid var(--rule)}
#nav ul a{display:block;padding:.28rem .5rem;color:var(--ink);text-decoration:none;font-size:.95rem;border-radius:2px}
#nav ul a:hover{background:var(--rule2)}
#nav ul a[aria-current="page"]{background:var(--stamp-bg);color:var(--stamp);font-weight:700}
main{padding:1.6rem 2rem 6rem;min-width:0;max-width:74rem}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 .5rem;font-weight:700}
h1:focus{outline:none}
.lead{color:var(--ink2);max-width:64ch;margin:0 0 1.1rem}
.crumb{font-size:.9rem;color:var(--ink2);margin:0 0 .5rem}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.25rem}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(19rem,26rem);gap:1.5rem;align-items:start}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:1.25rem 1.5rem}
.flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:1.1rem 1.75rem}
.flds>.f-c,.flds>.fh,.flds>.f-x{grid-column:1/-1}
.f[hidden]{display:none}
.fh{font-size:1rem;margin:.5rem 0 0;padding-top:.8rem;border-top:1px solid var(--rule);font-weight:700}
.flds>.fh:first-child{border-top:0;padding-top:0;margin-top:0}
label,legend{display:block;font-size:.9rem;color:var(--ink2);margin:0 0 .15rem;padding:0}
.ln{display:flex;align-items:baseline;border-bottom:2px solid var(--ink)}
.ln:focus-within{background:var(--stamp-bg);outline:3px solid var(--stamp);outline-offset:1px}
.ln:has([aria-invalid="true"]){border-bottom-color:var(--bad)}

add('card', {
  id: 'qtc', title: 'Interval QT corectat', tags: 'QTc Bazett Fridericia Framingham Hodges aritmie torsada varfurilor',
  desc: 'Patru formule de corecție a intervalului QT pentru frecvența cardiacă.',
  fields: [N('qt', 'Interval QT măsurat', { u: 'ms', min: 200, max: 800 }), N('hr', 'Frecvența cardiacă', { u: '/min', min: 20, max: 250 })],
  calc: function (v) {
    var rr = 60 / v.hr, qtS = v.qt / 1000;
    var bazett = v.qt / Math.sqrt(rr);
    var frid = v.qt / Math.cbrt(rr);
    var fram = (qtS + 0.154 * (1 - rr)) * 1000;
    var hodges = v.qt + 1.75 * (v.hr - 60);
    return { out: [
      { l: 'Bazett', v: bazett, u: 'ms', dp: 0, big: true },
      { l: 'Fridericia', v: frid, u: 'ms', dp: 0 },
      { l: 'Framingham', v: fram, u: 'ms', dp: 0 },
      { l: 'Hodges', v: hodges, u: 'ms', dp: 0 }
    ], notes: [['info', 'Bazett este cea mai folosită formulă, dar supracorectează la frecvențe mari. Fridericia și Framingham sunt considerate mai stabile pe intervalul larg de frecvențe. Un QTc peste aproximativ 450 ms la bărbați sau 460 ms la femei este de obicei considerat prelungit, iar peste 500 ms crește riscul de torsada vârfurilor; aceste praguri variază între surse și rămân la latitudinea clinică.']] };
  },
  formula: 'Bazett: QT/√RR. Fridericia: QT/∛RR. Framingham: QT + 0,154×(1−RR), calculat în secunde. Hodges: QT + 1,75×(FC−60). RR este intervalul R-R în secunde (60/FC).'
});

add('card', {
  id: 'ldl', title: 'Colesterol LDL calculat', tags: 'Friedewald Sampson non-HDL lipide profil lipidic',
  desc: 'Formula Friedewald clasică și formula Sampson (mai precisă la trigliceride mari), plus colesterolul non-HDL.',
  fields: [N('tc', 'Colesterol total', { u: U.chol, min: 50, max: 500 }), N('hdl', 'HDL', { u: U.chol, min: 5, max: 150 }), N('tg', 'Trigliceride', { u: U.tg, min: 20, max: 1200 })],
  calc: function (v) {
    var out = [{ l: 'Colesterol non-HDL', v: v.tc - v.hdl, u: 'mg/dL', dp: 0, big: true }];
    if (v.tg < 400) out.push({ l: 'LDL, formula Friedewald', v: v.tc - v.hdl - v.tg / 5, u: 'mg/dL', dp: 0 });
    else out.push({ l: 'LDL, formula Friedewald', s: 'Nu se aplică peste 400 mg/dL trigliceride' });
    if (v.tg < 800) {
      var ldlS = v.tc / 0.948 - v.hdl / 0.971 - (v.tg / 8.56 + v.tg * (v.tc - v.hdl) / 2140 - v.tg * v.tg / 16100) - 9.44;
      out.push({ l: 'LDL, formula Sampson', v: ldlS, u: 'mg/dL', dp: 0 });
    } else out.push({ l: 'LDL, formula Sampson', s: 'Nu se aplică peste 800 mg/dL trigliceride' });
    return { out: out, notes: [['info', 'Valorile trebuie introduse în mg/dL pentru aceste formule; la nevoie conversia se face cu convertorul de unități lipidice.']] };
  },
  formula: 'Friedewald: LDL = CT − HDL − TG/5, valabilă sub 400 mg/dL trigliceride. Sampson (Sampson și colab., 2020): LDL = CT/0,948 − HDL/0,971 − (TG/8,56 + TG×non-HDL/2140 − TG²/16100) − 9,44, valabilă sub 800 mg/dL trigliceride.'
});

add('card', {

A('ati', 'news2', 'NEWS2 (scala națională britanică de deteriorare)', 'scala 1 alerta precoce deteriorare clinica',
  'Scală de alertă precoce pentru deteriorarea clinică, folosind scala 1 pentru saturația de oxigen (pentru pacienți fără insuficiență respiratorie hipercapnică cunoscută).',
  [N('rr', 'Frecvență respiratorie', { u: '/min', min: 4, max: 60 }), N('spo2', 'Saturație de oxigen', { u: '%', min: 50, max: 100 }),
   K('oxygen', 'Primește oxigen suplimentar', 1), N('sbp', 'Tensiune arterială sistolică', { u: 'mmHg', min: 40, max: 300 }),
   N('hr', 'Frecvență cardiacă', { u: '/min', min: 20, max: 250 }), K('conscious', 'Alterare a stării de conștiență (nou confuz, răspunde la voce, la durere sau neresponsiv)', 1),
   N('temp', 'Temperatură', { u: U.temp, min: 30, max: 43 })],
  function (v) {
    function band(x, edges) { for (var i = 0; i < edges.length; i++) { var e = edges[i]; if (x >= e[0] && x < e[1]) return e[2]; } return 0; }
    var rrP = band(v.rr, [[-Infinity, 9, 3], [9, 12, 1], [12, 21, 0], [21, 25, 2], [25, Infinity, 3]]);
    var spo2P = band(v.spo2, [[-Infinity, 92, 3], [92, 94, 2], [94, 96, 1], [96, Infinity, 0]]);
    var o2P = v.oxygen ? 2 : 0;
    var sbpP = band(v.sbp, [[-Infinity, 91, 3], [91, 101, 2], [101, 111, 1], [111, 220, 0], [220, Infinity, 3]]);
    var hrP = band(v.hr, [[-Infinity, 41, 3], [41, 51, 1], [51, 91, 0], [91, 111, 1], [111, 131, 2], [131, Infinity, 3]]);
    var consP = v.conscious ? 3 : 0;
    var tempP = band(v.temp, [[-Infinity, 35.1, 3], [35.1, 36.1, 1], [36.1, 38.1, 0], [38.1, 39.1, 1], [39.1, Infinity, 2]]);
    var tot = rrP + spo2P + o2P + sbpP + hrP + consP + tempP;
    var anyThree = Math.max(rrP, spo2P, o2P, sbpP, hrP, consP, tempP) >= 3;
    var tone = 'ok', label = 'Risc scăzut', txt = 'Monitorizare de rutină.';
    if (tot >= 7) { tone = 'bad'; label = 'Risc crescut'; txt = 'Evaluare urgentă de către o echipă cu competență în terapie critică.'; }
    else if (tot >= 5 || anyThree) { tone = 'warn'; label = 'Risc mediu'; txt = 'Evaluare urgentă de către un medic; monitorizare cel puțin orară.'; }
    return { out: [B(O('Scor NEWS2', tot, 'puncte', 0, { tone: tone })), T('Interpretare', label + '. ' + txt, tone)],
      notes: [['info', 'Calculul folosește scala 1 pentru saturația de oxigen. Pentru pacienți cu insuficiență respiratorie hipercapnică cunoscută (de exemplu BPOC cu retenție de CO2), ghidul folosește scala 2, cu praguri diferite, neinclusă aici.']] };
  },
  'Royal College of Physicians, 2017. Șapte parametri fiziologici, fiecare notat de la 0 la 3 puncte; scorul total și pragul "orice parametru cu 3 puncte" determină nivelul de răspuns clinic.');

A('ati', 'aa_gradient', 'Gradientul alveolo-arterial de oxigen', 'A-a gradient hipoxemie cauza',
  'Diferența dintre presiunea alveolară și cea arterială de oxigen, utilă pentru a diferenția cauzele de hipoxemie.',
  [N('fio2', 'FiO2', { u: '%', min: 21, max: 100 }), N('paco2', 'PaCO2', { u: U.o2, min: 10, max: 150 }), N('pao2', 'PaO2', { u: U.o2, min: 20, max: 600 }),
   N('age', 'Vârsta', { u: 'ani', min: 1, max: 110, opt: true, hint: 'Opțional, pentru valoarea așteptată' })],
  function (v) {
    var patm = 760, ph2o = 47, rq = 0.8;
    var pao2alv = (v.fio2 / 100) * (patm - ph2o) - v.paco2 / rq;
    var grad = pao2alv - v.pao2;
    var out = [{ l: 'PAO2 alveolar calculat', v: pao2alv, u: 'mmHg', dp: 0 }, B(O('Gradient A-a', grad, 'mmHg', 0))];
    if (isFinite(v.age)) out.push({ l: 'Valoare așteptată la vârsta dată', s: 'aproximativ ' + nf(v.age / 4 + 4, 0) + ' mmHg' });
    return { out: out, notes: [['info', 'Formula presupune presiune atmosferică la nivelul mării (760 mmHg) și presiune parțială a vaporilor de apă de 47 mmHg.']] };
  },
  'PAO2 = FiO2 × (760 − 47) − PaCO2 / 0,8. Gradient A-a = PAO2 − PaO2. Valoarea așteptată la o persoană sănătoasă respirând aer atmosferic este aproximată la (vârsta/4) + 4 mmHg.');

A('ati', 'oxygenation_index', 'Indicele de oxigenare (OI)', 'OI ARDS pediatric ECMO ventilatie',
  'Severitatea insuficienței respiratorii la pacienți ventilați mecanic invaziv, folosit mai ales în ARDS pediatric.',
  [N('fio2', 'FiO2', { u: '%', min: 21, max: 100 }), N('map', 'Presiune medie în căile aeriene', { u: 'cmH2O', min: 1, max: 60 }), N('pao2', 'PaO2', { u: U.o2, min: 20, max: 600 })],

      notes: [['info', 'Se aplică la pacienți cu ventilație mecanică invazivă. Pragurile de severitate sunt cele din definiția PALICC pentru ARDS pediatric; folosirea la adulți este posibilă ca indice de tendință, dar pragurile respective sunt validate în populația pediatrică.']] };

A('ati', 'ventilatory_ratio', 'Raportul ventilator (VR)', 'ventilatory ratio spatiu mort ARDS Sinha',
  'Indice simplu de eficiență a ventilației, calculat la patul bolnavului, corelat cu fracția de spațiu mort.',
  [SEX, N('h', 'Înălțime', { u: U.cm, min: 100, max: 250 }), N('vt', 'Volum curent', { u: 'mL', min: 100, max: 1200 }),
   N('rr', 'Frecvență respiratorie', { u: '/min', min: 4, max: 60 }), N('paco2', 'PaCO2 măsurat', { u: U.o2, min: 10, max: 150 })],
  function (v) {
    var over = Math.max(0, v.h / 2.54 - 60);
    var pbw = (v.sex === 'm' ? 50 : 45.5) + 2.3 * over;
    var vePred = pbw * 100;
    var veMeas = v.vt * v.rr;
    var vr = (veMeas * v.paco2) / (vePred * 37.5);
    return { out: [{ l: 'Greutate corporală prezisă', v: pbw, u: 'kg', dp: 1 }, { l: 'Ventilație pe minut măsurată', v: veMeas / 1000, u: 'L/min', dp: 1 },
      B(O('Raport ventilator', vr, '', 2, { bands: [
        [-Infinity, 1.2, 'ok', 'Ventilație eficientă', '', '≤ 1,2'], [1.2, 2, 'warn', 'Ventilație moderat ineficientă', '', '1,2-2'], [2, Infinity, 'bad', 'Ventilație marcat ineficientă', '', '> 2']] }))],
      notes: [['info', 'O valoare apropiată de 1 este considerată normală. Pragurile de mai sus sunt orientative; studiul original (Sinha și colab., 2019) l-a folosit mai ales ca predictor continuu de risc în ARDS, nu ca prag fix.']] };
  },
  'VR = (ventilație pe minut măsurată în mL/min × PaCO2 măsurat) / (greutate corporală prezisă × 100 × 37,5). Greutatea corporală prezisă folosește formula Devine.');

A('ati', 'rox', 'Indicele ROX', 'ROX HFNC canula nazala flux inalt esec intubare',
  'Predicția succesului sau eșecului canulei nazale cu flux înalt la pacienți cu insuficiență respiratorie hipoxemică.',
  [N('spo2', 'Saturație de oxigen', { u: '%', min: 50, max: 100 }), N('fio2', 'FiO2', { u: '%', min: 21, max: 100 }), N('rr', 'Frecvență respiratorie', { u: '/min', min: 4, max: 60 })],
  function (v) {
    var rox = (v.spo2 / (v.fio2 / 100)) / v.rr;
    return { out: [B(O('Indice ROX', rox, '', 2, { bands: [
      [-Infinity, 3.85, 'bad', 'Risc crescut de eșec al canulei cu flux înalt', '', '< 3,85'],
      [3.85, 4.88, 'warn', 'Zonă intermediară', '', '3,85-4,87'],
      [4.88, Infinity, 'ok', 'Probabilitate mai mare de succes', '', '≥ 4,88']] }))],
      notes: [['info', 'Pragurile validate original sunt măsurate la 2, 6 și 12 ore de la inițierea canulei cu flux înalt: succes probabil peste 4,88; risc de eșec sub 2,85 la 2 ore, sub 3,47 la 6 ore, sub 3,85 la 12 ore. Banda de mai sus folosește pragul la 12 ore ca reper general.']] };
  },
  'ROX = (SpO2/FiO2) / frecvența respiratorie. Roca și colab., 2019, la pacienți cu pneumonie și insuficiență respiratorie hipoxemică acută.');

A('ati', 'driving_pressure', 'Presiunea de distensie și complianța statică', 'driving pressure complianta ventilator ARDS',
  'Presiunea de distensie a sistemului respirator și complianța statică, la pacienți ventilați mecanic în volum controlat, fără efort respirator propriu.',
  [N('plat', 'Presiune de platou', { u: 'cmH2O', min: 1, max: 60 }), N('peep', 'PEEP setat', { u: 'cmH2O', min: 0, max: 30 }), N('vt', 'Volum curent', { u: 'mL', min: 100, max: 1200 })],
  function (v) {
    var dp = v.plat - v.peep;
    var compl = v.vt / dp;
    return { out: [B(O('Presiune de distensie', dp, 'cmH2O', 1, { bands: [[-Infinity, 15, 'ok', 'Sub pragul de risc', '', '< 15'], [15, Infinity, 'bad', 'Peste pragul asociat cu risc crescut', '', '≥ 15']] })),
      { l: 'Complianță statică', v: compl, u: 'mL/cmH2O', dp: 1 }],
      notes: [['info', 'Presupune că pacientul nu are efort respirator spontan în momentul măsurării presiunii de platou.']] };
  },
  'Presiune de distensie = presiune de platou − PEEP. Complianță statică = volum curent / presiune de distensie. Pragul de 15 cmH2O este cel asociat cu mortalitate crescută în ARDS (Amato și colab., 2015).');

A('ati', 'rsbi', 'Indicele de respirație rapidă și superficială (RSBI)', 'RSBI detubare sevraj weaning',
  'Predictor al succesului detubării, calculat în timpul unei probe de respirație spontană.',
  [N('rr', 'Frecvență respiratorie', { u: '/min', min: 4, max: 80 }), N('vt', 'Volum curent', { u: 'mL', min: 50, max: 1200 })],
  function (v) {
    var rsbi = v.rr / (v.vt / 1000);
    return { out: [B(O('RSBI', rsbi, '/min/L', 0, { bands: [[-Infinity, 105, 'ok', 'Sub pragul asociat cu succesul detubării', '', '< 105'], [105, Infinity, 'bad', 'Peste pragul asociat cu risc de eșec', '', '≥ 105']] }))] };
  },
  'RSBI = frecvența respiratorie / volumul curent (în litri), măsurate în timpul respirației spontane, de obicei în primele minute ale unei probe de respirație spontană (Yang și Tobin, 1991).');

A('ati', 'parkland', 'Formula Parkland pentru arsuri', 'resuscitare volemica arsuri fluide',
  'Necesarul de fluide în primele 24 de ore de la o arsură de suprafață mare.',
  [N('w', 'Greutate', { u: U.kg, min: 1, max: 300 }), N('tbsa', 'Suprafața corporală arsă', { u: '%', min: 1, max: 100 })],
  function (v) {
    var tot = 4 * v.w * v.tbsa;
    return { out: [B(O('Volum total în primele 24 de ore', tot, 'mL', 0)),
      { l: 'În primele 8 ore de la momentul arsurii', v: tot / 2, u: 'mL' },
      { l: 'În următoarele 16 ore', v: tot / 2, u: 'mL' }],
      notes: [['info', 'Timpul se calculează de la momentul arsurii, nu de la momentul prezentării. Formula estimează necesarul cu soluții cristaloide (Ringer lactat); ritmul se ajustează după diureză.']] };
  },
  'Volum (mL) = 4 × greutate (kg) × procentul suprafeței corporale arse, jumătate administrată în primele 8 ore de la arsură și jumătate în următoarele 16 ore.');

A('ati', 'tbsa9', 'Regula lui 9 pentru suprafața arsă', 'TBSA arsuri adult copil suprafata',
  'Estimarea rapidă a procentului de suprafață corporală arsă.',
  [S('grp', 'Grupa de vârstă', [['a', 'Adult'], ['c', 'Copil (regula lui 9 pediatrică, aproximativă)']])],
  function (v) {
    var rows = v.grp === 'a'
      ? [['Cap și gât', 9], ['Fiecare membru superior', 9], ['Trunchi anterior', 18], ['Trunchi posterior', 18], ['Fiecare membru inferior', 18], ['Perineu', 1]]
      : [['Cap și gât', 18], ['Fiecare membru superior', 9], ['Trunchi anterior', 18], ['Trunchi posterior', 18], ['Fiecare membru inferior', 13.5], ['Perineu', 1]];
    return { out: rows.map(function (r) { return { l: r[0], v: r[1], u: '%' }; }),
      notes: [['info', 'Este o estimare rapidă. Pentru suprafețe neregulate sau la copii mici, diagrama Lund-Browder este mai precisă decât regula lui 9.']] };
  },
  'Procente convenționale ale suprafeței corporale, diferite la adult față de copil, unde capul are o pondere mai mare și membrele inferioare una mai mică, din cauza proporțiilor corporale diferite.');

/* ===== Pneumologie ===== */
cat('pne', 'Pneumologie');

SCORE('pne', 'curb65', 'CURB-65', 'pneumonie severitate spitalizare',
  'Severitatea pneumoniei comunitare și decizia de spitalizare.',
  [K('confusion', 'Confuzie nou instalată', 1), N('urea', 'Uree serică', { u: U.urea, min: 1, max: 60, pf: function (x) { return x > 7 ? 1 : 0; } }),
   K('rr', 'Frecvență respiratorie 30/min sau peste', 1), K('bp', 'Tensiune sistolică sub 90 mmHg sau diastolică 60 mmHg sau sub', 1), K('age', 'Vârsta 65 de ani sau peste', 1)],
  [[0, 2, 'ok', 'Risc scăzut', 'Scor 0-1: tratament ambulator este de obicei posibil.'],
   [2, 3, 'warn', 'Risc moderat', 'Scor 2: se ia în considerare internarea sau supravegherea apropiată.'],
   [3, Infinity, 'bad', 'Risc crescut', 'Scor 3-5: internare recomandată; la 4-5 puncte se ia în considerare terapia intensivă.']],
  'Lim și colab., 2003. Un punct pentru fiecare: confuzie, uree peste 7 mmol/L, frecvență respiratorie 30/min sau peste, tensiune sistolică sub 90 sau diastolică 60 mmHg sau sub, vârsta 65 de ani sau peste.');

A('pne', 'pachete_an', 'Indicele pachete-an', 'fumat tabagism risc',
  'Cuantifică expunerea cumulativă la fumat.',
  [N('perday', 'Țigarete pe zi', { u: 'țigarete/zi', min: 1, max: 100 }), N('years', 'Ani de fumat', { u: 'ani', min: 0.5, max: 80 })],
  function (v) {
    var py = (v.perday / 20) * v.years;
    return { out: [B(O('Pachete-an', py, '', 1))] };
  },
  'Pachete-an = (țigarete pe zi / 20) × numărul de ani de fumat.');

A('pne', 'spirometrie', 'Interpretare de bază a spirometriei', 'FEV1 FVC Tiffeneau obstructie restrictie',
  'Orientare inițială obstrucție versus restricție, pe baza raportului FEV1/FVC și a FEV1 procentual din valoarea prezisă.',
  [N('fev1', 'FEV1 măsurat', { u: 'L', min: 0.3, max: 7 }), N('fvc', 'FVC măsurat', { u: 'L', min: 0.3, max: 8 }),
   N('fev1pred', 'FEV1 procent din valoarea prezisă', { u: '%', min: 10, max: 150, opt: true, hint: 'Opțional, pentru severitate' })],
  function (v) {
    var ratio = v.fev1 / v.fvc * 100;
    var out = [B(O('Raport FEV1/FVC', ratio, '%', 0, { bands: [[-Infinity, 70, 'warn', 'Sugerează tipar obstructiv', '', '< 70'], [70, Infinity, 'ok', 'Nu sugerează obstrucție', '', '≥ 70']] }))];
    if (isFinite(v.fev1pred)) {
      var sev = v.fev1pred >= 80 ? 'Ușoară sau normală' : v.fev1pred >= 50 ? 'Moderată' : v.fev1pred >= 30 ? 'Severă' : 'Foarte severă';
      out.push({ l: 'Severitate orientativă după FEV1 procentual (dacă raportul indică obstrucție)', s: sev + ' (FEV1 ' + nf(v.fev1pred, 0) + '% din prezis)' });
    }
    return { out: out, notes: [['info', 'Un raport FEV1/FVC sub 70% orientează spre un tipar obstructiv, dar diagnosticul de certitudine folosește limita inferioară a normalului specifică vârstei, nu un prag fix de 70%, mai ales la vârstnici. Un tipar restrictiv nu poate fi confirmat fără măsurarea volumelor pulmonare (pletismografie); FVC scăzut cu raport normal doar sugerează restricția.']] };
  },
  'Raport FEV1/FVC × 100. Pragul de 70% este cel folosit tradițional (GOLD); severitatea obstrucției urmează procentul FEV1 din valoarea prezisă.');

A('pne', 'bode', 'Indicele BODE', 'BPOC prognostic mortalitate',
  'Estimarea prognosticului la pacienți cu bronhopneumopatie obstructivă cronică, din patru variabile.',
  [N('bmi', 'Indice de masă corporală', { u: 'kg/m²', min: 10, max: 50 }),
   N('fev1', 'FEV1 procent din valoarea prezisă', { u: '%', min: 5, max: 150 }),
   S('mmrc', 'Scala de dispnee mMRC', [[0, '0: dispnee doar la efort intens'], [1, '1: dispnee la mers grăbit sau urcat o pantă ușoară'], [2, '2: mers mai lent decât persoanele de aceeași vârstă din cauza dispneei'], [3, '3: se oprește pentru a respira după aproximativ 100 m'], [4, '4: dispnee la îmbrăcare sau la ieșirea din casă']], { sc: false }),
   N('sixmw', 'Distanța parcursă în 6 minute', { u: 'm', min: 0, max: 800 })],
  function (v) {
    var bPts = v.bmi <= 21 ? 1 : 0;
    var oPts = v.fev1 >= 65 ? 0 : (v.fev1 >= 50 ? 1 : (v.fev1 >= 36 ? 2 : 3));
    var dPts = v.mmrc >= 3 ? 3 : v.mmrc;
    var ePts = v.sixmw >= 350 ? 0 : (v.sixmw >= 250 ? 1 : (v.sixmw >= 150 ? 2 : 3));
    var tot = bPts + oPts + dPts + ePts;
    return { out: [B(O('Scor BODE', tot, 'din 10 puncte', 0, { bands: [
        [0, 3, 'ok', 'Risc mai scăzut', '', '0-2'], [3, 5, 'warn', 'Risc moderat', '', '3-4'], [5, 7, 'bad', 'Risc crescut', '', '5-6'], [7, Infinity, 'bad', 'Risc foarte crescut', '', '7-10']] })),
      { l: 'Indice de masă corporală', v: bPts, u: 'puncte' }, { l: 'Obstrucție (FEV1%)', v: oPts, u: 'puncte' },
      { l: 'Dispnee (mMRC)', v: dPts, u: 'puncte' }, { l: 'Capacitate de efort (test de mers 6 minute)', v: ePts, u: 'puncte' }],
      notes: [['warn', 'Formula acestui indice provine din memorie și nu a fost reverificată printr-o căutare dedicată în această sesiune; recomand o verificare încrucișată înainte de a-l folosi în decizii clinice.']] };
  },
  'Celli și colab., 2004. B = indice de masă corporală (1 punct dacă IMC 21 sau sub). O = obstrucție, din FEV1 procentual (0-3 puncte). D = dispnee mMRC (0-3 puncte, gradele 3 și 4 valorează amândouă 3 puncte). E = capacitate de efort, din testul de mers 6 minute (0-3 puncte). Maximum 10 puncte.');

A('pne', 'gold', 'Clasificarea GOLD în BPOC (grad spirometric și grupa ABE)', 'BPOC GOLD stadializare grup ABE exacerbari tratament',
  'Gradul spirometric și grupa de risc simptomatic-exacerbări, pentru orientarea tratamentului inițial în bronhopneumopatia obstructivă cronică.',
  [N('fev1', 'FEV1 procent din valoarea prezisă (post-bronhodilatator)', { u: '%', min: 5, max: 150 }),
   S('burden', 'Povara simptomelor', [[0, 'mMRC 0-1 sau CAT sub 10'], [1, 'mMRC 2 sau peste, sau CAT 10 sau peste']], { sc: false }),
   N('exac', 'Numărul de exacerbări moderate sau severe în ultimele 12 luni', { u: '', min: 0, max: 20 }),
   K('hosp', 'Cel puțin o exacerbare a necesitat spitalizare', 1)],
  function (v) {
    var grade = v.fev1 >= 80 ? 1 : (v.fev1 >= 50 ? 2 : (v.fev1 >= 30 ? 3 : 4));
    var gradeLabel = ['', 'Ușor (GOLD 1)', 'Moderat (GOLD 2)', 'Sever (GOLD 3)', 'Foarte sever (GOLD 4)'][grade];
    var group = (v.exac >= 1 || v.hosp) ? 'E' : (v.burden === 1 ? 'B' : 'A');
    var groupTxt = { A: 'Grupa A: bronhodilatator (fără preferință de clasă).', B: 'Grupa B: bronhodilatator dublu, LABA plus LAMA.', E: 'Grupa E: bronhodilatator dublu, LABA plus LAMA; se ia în considerare adăugarea de corticosteroid inhalator dacă eozinofilele sanguine sunt 300/µL sau peste.' }[group];
    return { out: [
      { l: 'Grad spirometric', s: gradeLabel },
      B(O('Grupa GOLD (simptome și exacerbări)', null, '', null, { s: group, big: true })),
      T('Orientare de tratament inițial', groupTxt, group === 'A' ? 'ok' : (group === 'B' ? 'warn' : 'bad'))
    ], notes: [['info', 'Gradul spirometric necesită un raport FEV1/FVC post-bronhodilatator sub 0,70 pentru diagnosticul de BPOC; acest calculator presupune diagnosticul deja stabilit. Pragurile grupei E reflectă actualizarea din raportul GOLD 2026 (o singură exacerbare moderată sau severă în ultimul an încadrează direct în grupa E, indiferent de simptome); rapoartele GOLD se actualizează anual și merită verificat dacă a apărut o versiune mai recentă.']] };
  },
  'Grad spirometric din FEV1 procentual: 1 (ușor) FEV1 80% sau peste; 2 (moderat) 50-79%; 3 (sever) 30-49%; 4 (foarte sever) sub 30%. Grupa: E dacă a existat cel puțin o exacerbare moderată sau severă în ultimul an (indiferent de simptome); altfel B dacă simptomele sunt importante (mMRC 2 sau peste, ori CAT 10 sau peste); altfel A.');

/* ===== Nefrologie și echilibru hidroelectrolitic ===== */
cat('nef', 'Nefrologie și echilibru hidroelectrolitic');

A('nef', 'cockcroft', 'Clearance la creatinină (Cockcroft-Gault)', 'CrCl clearance creatinina dozare renala',
  'Estimarea clearance-ului la creatinină, folosită frecvent pentru ajustarea dozelor de medicamente.',
  [SEX, N('age', 'Vârsta', { u: 'ani', min: 18, max: 110 }), N('w', 'Greutate', { u: U.kg, min: 20, max: 300 }), N('cr', 'Creatinină serică', { u: U.cr, min: 0.2, max: 20 })],
  function (v) {
    var crcl = ((140 - v.age) * v.w * (v.sex === 'f' ? 0.85 : 1)) / (72 * v.cr);
    return { out: [B(O('Clearance la creatinină estimat', crcl, 'mL/min', 0))],
      notes: [['info', 'Formula folosește greutatea reală; la pacienți obezi sau subponderali, unele protocoale recomandă greutatea ideală sau ajustată. Nu este validată pentru dozare la copii.']] };
  },
  'CrCl = [(140 − vârsta) × greutate (kg) × 0,85 dacă este femeie] / (72 × creatinină serică în mg/dL) (Cockcroft și Gault, 1976).');

A('nef', 'ckdepi2021', 'Rata de filtrare glomerulară (CKD-EPI 2021)', 'eGFR RFG boala renala cronica creatinina cistatina',
  'Rata de filtrare glomerulară estimată, fără variabila de rasă, cu formulele pe creatinină și pe creatinină plus cistatină C.',
  [SEX, N('age', 'Vârsta', { u: 'ani', min: 18, max: 110 }), N('cr', 'Creatinină serică', { u: U.cr, min: 0.2, max: 20 }),
   N('cys', 'Cistatină C serică', { u: 'mg/L', min: 0.3, max: 10, opt: true, hint: 'Opțional, pentru formula combinată' })],
  function (v) {
    var f = v.sex === 'f', kappa = f ? 0.7 : 0.9, alpha = f ? -0.241 : -0.302;
    var scrK = v.cr / kappa;
    var egfrCr = 142 * Math.pow(Math.min(scrK, 1), alpha) * Math.pow(Math.max(scrK, 1), -1.2) * Math.pow(0.9938, v.age) * (f ? 1.012 : 1);
    var out = [B(O('eGFR, formula pe creatinină', egfrCr, 'mL/min/1,73m²', 0, { bands: [
      [-Infinity, 15, 'bad', 'Stadiul G5', '', '< 15'], [15, 30, 'bad', 'Stadiul G4', '', '15-29'], [30, 45, 'warn', 'Stadiul G3b', '', '30-44'],
      [45, 60, 'warn', 'Stadiul G3a', '', '45-59'], [60, 90, 'ok', 'Stadiul G2', '', '60-89'], [90, Infinity, 'ok', 'Stadiul G1', '', '≥ 90']] }))];
    if (isFinite(v.cys)) {
      var alpha2 = f ? -0.219 : -0.144, kappa2 = f ? 0.7 : 0.9;
      var scrK2 = v.cr / kappa2, scysK = v.cys / 0.8;
      var egfrCrCys = 135 * Math.pow(Math.min(scrK2, 1), alpha2) * Math.pow(Math.max(scrK2, 1), -0.544) * Math.pow(Math.min(scysK, 1), -0.323) * Math.pow(Math.max(scysK, 1), -0.778) * Math.pow(0.9961, v.age) * (f ? 0.963 : 1);
      out.push({ l: 'eGFR, formula combinată creatinină și cistatină C', v: egfrCrCys, u: 'mL/min/1,73m²', dp: 0 });
    }
    return { out: out, notes: [['info', 'Stadializarea G1-G5 arătată aici este doar componenta de filtrare glomerulară; stadializarea KDIGO completă include și categoria de albuminurie (A1-A3).']] };
  },
  'CKD-EPI 2021: eGFR = 142 × min(Scr/κ,1)^α × max(Scr/κ,1)^−1,200 × 0,9938^vârstă × 1,012 dacă este femeie, cu κ = 0,7 (femei) sau 0,9 (bărbați) și α = −0,241 (femei) sau −0,302 (bărbați) (Inker și colab., 2021). Formula combinată cu cistatină C folosește constanta 135 și exponenți diferiți.');

A('nef', 'mdrd', 'Rata de filtrare glomerulară (MDRD)', 'eGFR MDRD formula veche',
  'Formula MDRD cu 4 variabile, fără variabila de rasă. CKD-EPI 2021 este în general preferată, mai ales la valori ale RFG peste 60.',
  [SEX, N('age', 'Vârsta', { u: 'ani', min: 18, max: 110 }), N('cr', 'Creatinină serică', { u: U.cr, min: 0.2, max: 20 })],
  function (v) {
    var egfr = 175 * Math.pow(v.cr, -1.154) * Math.pow(v.age, -0.203) * (v.sex === 'f' ? 0.742 : 1);
    return { out: [B(O('eGFR, formula MDRD', egfr, 'mL/min/1,73m²', 0))],
      notes: [['info', 'Versiune fără coeficientul de rasă, valabilă pentru dozări de creatinină standardizate IDMS. Este mai puțin precisă decât CKD-EPI la valori ale RFG peste 60 mL/min/1,73m².']] };
  },
  'eGFR = 175 × creatinină^−1,154 × vârstă^−0,203 × 0,742 dacă este femeie (Levey și colab., 2006, versiunea reexprimată IDMS).');

A('nef', 'schwartz', 'Rata de filtrare glomerulară la copil (Schwartz)', 'eGFR pediatric copil formula Schwartz',
  'Formula Schwartz actualizată (2009), pentru copii și adolescenți.',
  [N('h', 'Înălțime', { u: U.cm, min: 40, max: 200 }), N('cr', 'Creatinină serică', { u: U.cr, min: 0.1, max: 10 })],
  function (v) {
    var egfr = 0.413 * v.h / v.cr;
    return { out: [B(O('eGFR estimat', egfr, 'mL/min/1,73m²', 0))],
      notes: [['info', 'Valabilă pentru creatinină serică dozată enzimatic, standardizată. Constanta 0,413 este cea din versiunea actualizată (Schwartz și colab., 2009); versiunea originală din 1976 folosea 0,55 și alte unități.']] };
  },
  'eGFR = 0,413 × înălțime (cm) / creatinină serică (mg/dL).');

A('nef', 'fena', 'Excreția fracțională de sodiu și uree', 'FENa FEUrea insuficienta renala prerenala',
  'Diferențiază insuficiența renală acută prerenală de necroza tubulară acută.',
  [N('una', 'Sodiu urinar', { u: 'mmol/L', min: 1, max: 300 }), N('pna', 'Sodiu plasmatic', { u: 'mmol/L', min: 100, max: 170 }),
   N('ucr', 'Creatinină urinară', { u: U.ucr, min: 1, max: 500 }), N('pcr', 'Creatinină plasmatică', { u: U.cr, min: 0.1, max: 20 }),
   N('uurea', 'Uree urinară', { u: 'mmol/L', min: 1, max: 800, opt: true, hint: 'Opțional, pentru FEUrea (util dacă pacientul primește diuretice)' }), N('purea', 'Uree plasmatică', { u: U.urea, min: 1, max: 60, opt: true })],
  function (v) {
    var fena = (v.una * v.pcr) / (v.pna * v.ucr) * 100;
    var out = [B(O('FENa', fena, '%', 2, { bands: [[-Infinity, 1, 'warn', 'Sugerează cauză prerenală', '', '< 1%'], [1, Infinity, 'warn', 'Sugerează necroză tubulară acută', '', '≥ 1%']] }))];
    if (isFinite(v.uurea) && isFinite(v.purea)) {
      var feurea = (v.uurea * v.pcr) / (v.purea * v.ucr) * 100;
      out.push({ l: 'FEUrea', v: feurea, u: '%', dp: 1, bands: [[-Infinity, 35, 'warn', 'Sugerează cauză prerenală', '', '< 35%'], [35, Infinity, 'warn', 'Sugerează necroză tubulară acută', '', '≥ 35%']] });
    }
    return { out: out, notes: [['info', 'Interpretarea presupune un pacient oliguric, fără boală renală cronică preexistentă. FEUrea este utilă mai ales dacă pacientul a primit diuretice, care alterează FENa.']] };
  },
  'FENa = (sodiu urinar × creatinină plasmatică) / (sodiu plasmatic × creatinină urinară) × 100. FEUrea folosește aceeași formulă, cu uree în locul sodiului.');

A('nef', 'aniongap', 'Gaura anionică', 'anion gap acidoza metabolica corectat albumina',
  'Diferențierea acidozelor metabolice după gaura anionică, cu corecția pentru albumină.',
  [N('na', 'Sodiu', { u: 'mmol/L', min: 100, max: 170 }), N('cl', 'Clor', { u: 'mmol/L', min: 70, max: 140 }), N('hco3', 'Bicarbonat', { u: 'mmol/L', min: 2, max: 40 }),
   N('alb', 'Albumină', { u: U.alb, min: 1, max: 6, opt: true, hint: 'Opțional, pentru gaura anionică corectată' })],
  function (v) {
    var ag = v.na - (v.cl + v.hco3);
    var out = [B(O('Gaură anionică', ag, 'mmol/L', 0, { bands: [[-Infinity, 12, 'ok', 'Normală', '', '8-12'], [12, Infinity, 'warn', 'Crescută', '', '> 12']] }))];
    if (isFinite(v.alb)) out.push({ l: 'Gaură anionică corectată pentru albumină', v: ag + 2.5 * (4 - v.alb), u: 'mmol/L', dp: 1 });
    return { out: out, notes: [['info', 'Intervalul normal variază ușor între laboratoare, mai ales în funcție de metoda de dozare a clorului.']] };
  },
  'Gaură anionică = Na − (Cl + HCO3). Corecția pentru albumină adaugă 2,5 mmol/L pentru fiecare gram sub 4 g/dL de albumină.');

A('nef', 'osmolalitate', 'Osmolalitatea serică calculată și gaura osmolară', 'osmolalitate osmolar gap intoxicatie',
  'Osmolalitatea calculată și diferența față de valoarea măsurată, utilă pentru depistarea substanțelor osmotic active nemăsurate (de exemplu alcooli toxici).',
  [N('na', 'Sodiu', { u: 'mmol/L', min: 100, max: 170 }), N('glu', 'Glicemie', { u: U.glu, min: 20, max: 1000 }), N('urea', 'Uree', { u: U.urea, min: 1, max: 60 }),
   N('measured', 'Osmolalitate măsurată', { u: 'mOsm/kg', min: 250, max: 400, opt: true, hint: 'Opțională, pentru gaura osmolară' })],
  function (v) {
    var calc = 2 * v.na + v.glu / 18 + v.urea;
    var out = [B(O('Osmolalitate calculată', calc, 'mOsm/kg', 0))];
    if (isFinite(v.measured)) out.push({ l: 'Gaură osmolară', v: v.measured - calc, u: 'mOsm/kg', dp: 0, bands: [[-Infinity, 10, 'ok', 'Normală', '', '< 10'], [10, Infinity, 'bad', 'Crescută', '', '≥ 10']] });
    return { out: out };
  },
  'Osmolalitate calculată = 2 × sodiu (mmol/L) + glicemie (mg/dL)/18 + uree (mmol/L). Gaura osmolară = osmolalitatea măsurată − cea calculată; o valoare peste 10 mOsm/kg sugerează prezența unor solviți nemăsurați.');

A('nef', 'na_corectat', 'Sodiul corectat pentru hiperglicemie', 'sodiu corectat pseudohiponatremie glicemie',
  'Corectează sodiul măsurat pentru efectul diluțional al glicemiei crescute.',
  [N('na', 'Sodiu măsurat', { u: 'mmol/L', min: 100, max: 170 }), N('glu', 'Glicemie', { u: U.glu, min: 100, max: 1500 })],
  function (v) {
    var corr1 = v.na + 1.6 * ((v.glu - 100) / 100);
    var corr2 = v.na + 2.4 * ((v.glu - 100) / 100);
    return { out: [B(O('Sodiu corectat (factor 1,6)', corr1, 'mmol/L', 1)), { l: 'Sodiu corectat (factor 2,4, Hillier)', v: corr2, u: 'mmol/L', dp: 1 }],
      notes: [['info', 'Factorul clasic de 1,6 mmol/L pentru fiecare 100 mg/dL de glicemie peste normal (Katz, 1973) este cel mai folosit; factorul 2,4 (Hillier și colab., 1999) a fost propus ca fiind mai precis la glicemii foarte mari.']] };
  },
  'Na corectat = Na măsurat + 1,6 × [(glicemie − 100) / 100], sau cu factorul alternativ 2,4.');

A('nef', 'deficit_apa', 'Deficitul de apă liberă', 'hipernatremie deficit apa corectie',
  'Estimează volumul de apă liberă necesar pentru corectarea hipernatremiei.',
  [SEX, N('age', 'Vârsta', { u: 'ani', min: 1, max: 110 }), N('w', 'Greutate', { u: U.kg, min: 3, max: 300 }), N('na', 'Sodiu măsurat', { u: 'mmol/L', min: 140, max: 200 })],
  function (v) {
    var f = v.sex === 'f', elderly = v.age >= 65;
    var frac = f ? (elderly ? 0.45 : 0.5) : (elderly ? 0.5 : 0.6);
    var tbw = v.w * frac;
    var deficit = tbw * (v.na / 140 - 1);
    return { out: [B(O('Deficit de apă liberă', deficit, 'L', 1)), { l: 'Apă corporală totală estimată', v: tbw, u: 'L', dp: 1 }],
      notes: [['info', 'Corectează cel mult jumătate din deficit în primele 24 de ore, iar sodiul nu ar trebui să scadă cu mai mult de aproximativ 8-10 mmol/L în 24 de ore, pentru a evita edemul cerebral.']] };
  },
  'Apă corporală totală = greutate × fracția corespunzătoare vârstei și sexului (0,6 la bărbați adulți, 0,5 la femei adulte, 0,5 și respectiv 0,45 la vârstnici). Deficit de apă = apă corporală totală × (Na măsurat/140 − 1).');

A('nef', 'winter', 'Formula Winter', 'compensare respiratorie acidoza metabolica PaCO2 asteptat',
  'Verifică dacă răspunsul respirator la o acidoză metabolică este cel așteptat.',
  [N('hco3', 'Bicarbonat', { u: 'mmol/L', min: 2, max: 40 }), N('paco2', 'PaCO2 măsurat', { u: U.o2, min: 5, max: 100, opt: true, hint: 'Opțional, pentru comparație' })],
  function (v) {
    var expected = 1.5 * v.hco3 + 8;
    var out = [B(O('PaCO2 așteptat', expected, 'mmHg', 1)), { l: 'Interval așteptat', s: nf(expected - 2, 1) + ' - ' + nf(expected + 2, 1) + ' mmHg' }];
    if (isFinite(v.paco2)) {
      var txt = v.paco2 < expected - 2 ? 'PaCO2 măsurat este sub intervalul așteptat: se asociază o alcaloză respiratorie.'
        : v.paco2 > expected + 2 ? 'PaCO2 măsurat este peste intervalul așteptat: se asociază o acidoză respiratorie.'
        : 'PaCO2 măsurat se încadrează în intervalul așteptat: compensare respiratorie adecvată.';
      out.push(T('Comparație cu valoarea măsurată', txt, v.paco2 < expected - 2 || v.paco2 > expected + 2 ? 'warn' : 'ok'));
    }
    return { out: out };
  },
  'PaCO2 așteptat = 1,5 × HCO3 + 8, ± 2 (Winter și colab., 1967). Se aplică doar în acidoza metabolică.');

A('nef', 'hh', 'Ecuația Henderson-Hasselbalch', 'pH bicarbonat PaCO2 echilibru acido-bazic',
  'Calculează pH-ul așteptat din bicarbonat și PaCO2, sau verifică o valoare măsurată.',
  [N('hco3', 'Bicarbonat', { u: 'mmol/L', min: 2, max: 60 }), N('paco2', 'PaCO2', { u: U.o2, min: 5, max: 130 })],
  function (v) {
    var ph = 6.1 + Math.log10(v.hco3 / (0.03 * v.paco2));
    return { out: [B(O('pH calculat', ph, '', 2))], notes: [['info', 'Util pentru a verifica dacă o probă de gazometrie este internă consistentă; o discrepanță mare față de pH-ul măsurat sugerează eroare de prelevare sau de laborator.']] };
  },
  'pH = 6,1 + log10 [HCO3 / (0,03 × PaCO2)].');

A('nef', 'ca_corectat', 'Calciul corectat pentru albumină', 'calciu corectat hipoalbuminemie',
  'Corectează calciul total măsurat atunci când albumina serică este scăzută.',
  [N('ca', 'Calciu seric total', { u: U.ca, min: 3, max: 20 }), N('alb', 'Albumină', { u: U.alb, min: 1, max: 6 })],
  function (v) {
    var corr = v.ca + 0.8 * (4 - v.alb);
    return { out: [B(O('Calciu corectat', corr, 'mg/dL', 2))],
      notes: [['info', 'Corecția este o aproximare; la valori extreme ale albuminei sau în boală critică, calciul ionizat măsurat direct este mai fiabil.']] };
  },
  'Calciu corectat (mg/dL) = calciu total măsurat + 0,8 × (4 − albumină în g/dL).');

A('nef', 'ktv', 'Kt/V pentru hemodializă (Daugirdas)', 'Kt/V dializa adecvare',
  'Estimarea adecvării dializei, formula Daugirdas de generația a doua, cu un compartiment.',
  [N('bunpre', 'Uree (BUN) pre-dializă', { u: U.urea, min: 1, max: 60 }), N('bunpost', 'Uree (BUN) post-dializă', { u: U.urea, min: 0.5, max: 60 }),
   N('t', 'Durata ședinței', { u: 'ore', min: 1, max: 8 }), N('uf', 'Volum de ultrafiltrare', { u: 'L', min: 0, max: 8 }), N('w', 'Greutate post-dializă', { u: U.kg, min: 20, max: 250 })],
  function (v) {
    var r = v.bunpost / v.bunpre;
    var ktv = -Math.log(r - 0.008 * v.t) + (4 - 3.5 * r) * (v.uf / v.w);
    return { out: [B(O('Kt/V', ktv, '', 2, { bands: [[-Infinity, 1.2, 'warn', 'Sub ținta recomandată', '', '< 1,2'], [1.2, Infinity, 'ok', 'Atinge ținta recomandată', '', '≥ 1,2']] }))],
      notes: [['info', 'Ținta KDOQI este de cel puțin 1,2 per ședință, cu un obiectiv uzual în jur de 1,4.']] };
  },
  'Kt/V = −ln(R − 0,008 × t) + (4 − 3,5 × R) × (ultrafiltrare în litri / greutate post-dializă), unde R este raportul ureei post/pre-dializă și t este durata în ore (Daugirdas, 1993).');

cat('hep', 'Hepatologie');

A('hep', 'childpugh', 'Scorul Child-Pugh', 'ciroza severitate hepatica clasificare',
  'Clasificarea severității cirozei hepatice.',
  [S('bili', 'Bilirubină totală', [[1, 'Sub 2 mg/dL (34 µmol/L)'], [2, '2-3 mg/dL (34-51 µmol/L)'], [3, 'Peste 3 mg/dL (51 µmol/L)']]),
   S('alb', 'Albumină', [[1, 'Peste 3,5 g/dL (35 g/L)'], [2, '2,8-3,5 g/dL (28-35 g/L)'], [3, 'Sub 2,8 g/dL (28 g/L)']]),
   S('inr', 'INR', [[1, 'Sub 1,7'], [2, '1,7-2,3'], [3, 'Peste 2,3']]),
   S('ascites', 'Ascită', [[1, 'Absentă'], [2, 'Ușoară, controlată cu diuretice'], [3, 'Moderată sau severă, refractară']]),
   S('enceph', 'Encefalopatie hepatică', [[1, 'Absentă'], [2, 'Gradul 1-2'], [3, 'Gradul 3-4']])],
  function (v) {
    var tot = Number(v.bili) + Number(v.alb) + Number(v.inr) + Number(v.ascites) + Number(v.enceph);
    var cls = tot <= 6 ? 'A' : tot <= 9 ? 'B' : 'C';
    return { out: [B(O('Scor Child-Pugh', tot, 'din 15 puncte', 0, { bands: [[5, 7, 'ok', 'Clasa A', '', '5-6'], [7, 10, 'warn', 'Clasa B', '', '7-9'], [10, 16, 'bad', 'Clasa C', '', '10-15']] }))],
      notes: [['info', 'Clasa ' + cls + '. Supraviețuirea la un an și la doi ani scade progresiv de la clasa A la clasa C, dar cifrele exacte variază între studii și nu sunt reproduse aici.']] };
  },
  'Suma a cinci parametri, fiecare notat de la 1 la 3 puncte: bilirubină, albumină, INR, ascită, encefalopatie. Clasa A: 5-6 puncte. Clasa B: 7-9. Clasa C: 10-15.');

A('hep', 'meld', 'MELD, MELD-Na și MELD 3.0', 'MELD ciroza transplant hepatic prioritate',
  'Trei versiuni ale scorului de prioritizare pentru transplant hepatic.',
  [SEX, N('bili', 'Bilirubină totală', { u: U.bili, min: 0.1, max: 40 }), N('inr', 'INR', { u: '', min: 0.5, max: 10 }),
   N('cr', 'Creatinină', { u: U.cr, min: 0.1, max: 15 }), K('dialysis', 'Dializă de cel puțin două ori în ultima săptămână, sau 24 de ore continue de hemodializă veno-venoasă', 1),
   N('na', 'Sodiu', { u: 'mmol/L', min: 100, max: 170, opt: true, hint: 'Opțional, pentru MELD-Na și MELD 3.0' }),
   N('alb', 'Albumină', { u: U.alb, min: 1, max: 6, opt: true, hint: 'Opțional, pentru MELD 3.0' })],
  function (v) {
    var bili = Math.max(v.bili, 1), inr = Math.max(v.inr, 1);
    var cr = v.dialysis ? 4 : Math.max(Math.min(v.cr, 4), 1);
    var meld = 3.78 * Math.log(bili) + 11.2 * Math.log(inr) + 9.57 * Math.log(cr) + 6.43;
    meld = Math.round(meld);
    var out = [B(O('MELD', meld, 'puncte', 0))];
    var na = isFinite(v.na) ? Math.max(Math.min(v.na, 137), 125) : null;
    if (na !== null) {
      var meldNa = meld;
      if (meld > 11) meldNa = meld + 1.32 * (137 - na) - 0.033 * meld * (137 - na);
      meldNa = Math.round(meldNa);
      out.push({ l: 'MELD-Na', v: meldNa, u: 'puncte', dp: 0 });
    }
    if (na !== null && isFinite(v.alb)) {
      var albC = Math.max(Math.min(v.alb, 3.5), 1.5);
      var crC = v.dialysis ? 3 : Math.max(Math.min(v.cr, 3), 1);
      var bili3 = Math.max(v.bili, 1), inr3 = Math.max(v.inr, 1);
      var meld3 = 1.33 * (v.sex === 'f' ? 1 : 0) + 4.56 * Math.log(bili3) + 0.82 * (137 - na) - 0.24 * (137 - na) * Math.log(bili3)
        + 9.09 * Math.log(inr3) + 11.14 * Math.log(crC) + 1.85 * (3.5 - albC) - 1.83 * (3.5 - albC) * Math.log(crC) + 6;
      meld3 = Math.round(meld3);
      var surv90 = 100 * Math.pow(0.946, Math.exp(0.17698 * meld3 - 3.56));
      out.push({ l: 'MELD 3.0', v: meld3, u: 'puncte', dp: 0, big: true });
      out.push({ l: 'Supraviețuire estimată la 90 de zile (din MELD 3.0)', v: surv90, u: '%', dp: 0 });
    }
    return { out: out, notes: [['info', 'Valorile de laborator sunt plafonate conform regulilor scorului: minimum 1 pentru bilirubină, INR și creatinină; creatinină maximum 4 (sau 4 direct, dacă pacientul este dializat); pentru MELD 3.0, sodiul este limitat la intervalul 125-137 și albumina la 1,5-3,5 g/dL.']] };
  },
  'MELD = 3,78×ln(bilirubină) + 11,2×ln(INR) + 9,57×ln(creatinină) + 6,43. MELD-Na adaugă o corecție pentru sodiu dacă MELD depășește 11. MELD 3.0 (Kim și colab., 2021) include sexul feminin și albumina: 1,33×(dacă femeie) + 4,56×ln(bilirubină) + 0,82×(137−Na) − 0,24×(137−Na)×ln(bilirubină) + 9,09×ln(INR) + 11,14×ln(creatinină) + 1,85×(3,5−albumină) − 1,83×(3,5−albumină)×ln(creatinină) + 6.');

A('hep', 'fib4', 'FIB-4', 'fibroza hepatica noninvaziv AST ALT',
  'Estimare neinvazivă a probabilității de fibroză hepatică avansată.',
  [N('age', 'Vârsta', { u: 'ani', min: 18, max: 110 }), N('ast', 'AST', { u: 'U/L', min: 5, max: 2000 }), N('alt', 'ALT', { u: 'U/L', min: 5, max: 2000 }), N('plt', 'Trombocite', { u: '×10⁹/L', min: 5, max: 800 })],
  function (v) {
    var fib4 = (v.age * v.ast) / (v.plt * Math.sqrt(v.alt));
    return { out: [B(O('FIB-4', fib4, '', 2, { bands: [[-Infinity, 1.3, 'ok', 'Improbabilă fibroză avansată', '', '< 1,3'], [1.3, 2.67, 'warn', 'Zonă neconcludentă', '', '1,3-2,67'], [2.67, Infinity, 'bad', 'Posibilă fibroză avansată', '', '> 2,67']] }))],
      notes: [['info', 'Pragul inferior de 1,3 este validat mai ales sub 65 de ani; unele ghiduri folosesc 2,0 ca prag inferior peste această vârstă.']] };
  },
  'FIB-4 = (vârsta × AST) / (trombocite × √ALT).');

A('hep', 'apri', 'APRI', 'fibroza hepatica AST trombocite noninvaziv',
  'Alt indice neinvaziv de fibroză hepatică, din AST și trombocite.',
  [N('ast', 'AST', { u: 'U/L', min: 5, max: 2000 }), N('astuln', 'Limita superioară a normalului pentru AST în laboratorul dumneavoastră', { u: 'U/L', min: 20, max: 60, opt: true, hint: 'Implicit 40 U/L dacă nu este specificată' }), N('plt', 'Trombocite', { u: '×10⁹/L', min: 5, max: 800 })],
  function (v) {
    var uln = isFinite(v.astuln) ? v.astuln : 40;
    var apri = ((v.ast / uln) / v.plt) * 100;
    return { out: [B(O('APRI', apri, '', 2, { bands: [[-Infinity, 0.5, 'ok', 'Improbabilă fibroză semnificativă', '', '< 0,5'], [0.5, 1.5, 'warn', 'Zonă neconcludentă', '', '0,5-1,5'], [1.5, Infinity, 'bad', 'Posibilă fibroză semnificativă sau ciroză', '', '> 1,5']] }))] };
  },
  'APRI = (AST / limita superioară a normalului) / trombocite (×10⁹/L) × 100.');

A('hep', 'albi', 'Scorul ALBI', 'fibroza hepatica bilirubina albumina carcinom hepatocelular',
  'Evaluarea funcției hepatice din bilirubină și albumină, folosită frecvent în carcinomul hepatocelular.',
  [N('bili', 'Bilirubină totală', { u: U.bili, min: 0.1, max: 40 }), N('alb', 'Albumină', { u: U.alb, min: 1, max: 6 })],
  function (v) {
    var biliUmol = v.bili * 17.104, albGL = v.alb * 10;
    var albi = 0.66 * Math.log10(biliUmol) - 0.085 * albGL;
    return { out: [B(O('Scor ALBI', albi, '', 2, { bands: [[-Infinity, -2.6, 'ok', 'Gradul 1', '', '≤ −2,60'], [-2.6, -1.39, 'warn', 'Gradul 2', '', '−2,60 la −1,39'], [-1.39, Infinity, 'bad', 'Gradul 3', '', '> −1,39']] }))]};
  },
  'ALBI = 0,66 × log10(bilirubină în µmol/L) − 0,085 × albumină (g/L) (Johnson și colab., 2015).');

A('hep', 'maddrey', 'Funcția discriminantă Maddrey', 'hepatita alcoolica severitate corticoterapie',
  'Severitatea hepatitei alcoolice și indicația de corticoterapie.',
  [N('pt', 'Timp de protrombină al pacientului', { u: 'secunde', min: 8, max: 100 }), N('ptctrl', 'Timp de protrombină de control (al laboratorului)', { u: 'secunde', min: 8, max: 20 }), N('bili', 'Bilirubină totală', { u: U.bili, min: 0.1, max: 40 })],
  function (v) {
    var df = 4.6 * (v.pt - v.ptctrl) + v.bili;
    return { out: [B(O('Funcție discriminantă Maddrey', df, '', 1, { bands: [[-Infinity, 32, 'ok', 'Boală mai puțin severă', '', '< 32'], [32, Infinity, 'bad', 'Boală severă', '', '≥ 32']] }))],
      notes: [['info', 'Un scor de 32 sau peste este pragul folosit clasic pentru a lua în considerare corticoterapia, în absența contraindicațiilor (infecție necontrolată, sângerare digestivă activă).']] };
  },
  'DF = 4,6 × (timp de protrombină al pacientului − timp de control) + bilirubină totală (mg/dL).');

A('hep', 'saag', 'Gradientul albumină ser-ascită (SAAG)', 'ascita hipertensiune portala cauza',
  'Diferențiază ascita prin hipertensiune portală de alte cauze.',
  [N('salb', 'Albumină serică', { u: U.alb, min: 0.5, max: 6 }), N('aalb', 'Albumină în lichidul de ascită', { u: U.alb, min: 0.1, max: 5 })],
  function (v) {
    var saag = v.salb - v.aalb;
    return { out: [B(O('SAAG', saag, 'g/dL', 1, { bands: [[-Infinity, 1.1, 'warn', 'Sugerează cauză neportală (peritoneală, malignă, pancreatică)', '', '< 1,1'], [1.1, Infinity, 'ok', 'Sugerează hipertensiune portală', '', '≥ 1,1']] }))] };
  },
  'SAAG = albumină serică − albumină în lichidul de ascită, ambele exprimate în g/dL, prelevate în aceeași zi.');

/* ===== Gastroenterologie ===== */
cat('gas', 'Gastroenterologie');

SCORE('gas', 'blatchford', 'Scorul Glasgow-Blatchford', 'sangerare digestiva superioara risc endoscopie',
  'Risc la pacienți cu sângerare digestivă superioară, evaluat înainte de endoscopie; un scor 0 sugerează că tratamentul ambulator poate fi sigur.',
  [N('bun', 'Uree (BUN)', { u: U.urea, min: 1, max: 60, bins: [[0, 0], [6.5, 2], [8, 3], [10, 4], [25, 6]] }),
   SEX,
   N('hb', 'Hemoglobină', { u: U.hb, min: 3, max: 20, pf: function (x, v) {
     if (v.sex === 'f') return x >= 12 ? 0 : (x >= 10 ? 1 : 6);
     return x >= 13 ? 0 : (x >= 12 ? 1 : (x >= 10 ? 3 : 6));
   } }),
   N('sbp', 'Tensiune sistolică', { u: 'mmHg', min: 50, max: 250, bins: [[0, 3], [90, 2], [100, 1], [110, 0]] }),

A('end', 'insulina_corectie', 'Doza de corecție cu insulină rapidă', 'factor de sensibilitate insulina corectie regula 1800',

A('hem', 'indici_eritrocitari', 'Indici eritrocitari derivați', 'MCH MCHC anemie hemoleucograma',
  'Calculează hemoglobina eritrocitară medie și concentrația medie din hemoglobină, hematocrit și numărul de eritrocite.',
  [N('hb', 'Hemoglobină', { u: U.hb, min: 2, max: 25 }), N('hct', 'Hematocrit', { u: '%', min: 5, max: 70 }), N('rbc', 'Număr de eritrocite', { u: '×10¹²/L', min: 0.5, max: 8 })],
  function (v) {
    var mcv = (v.hct * 10) / v.rbc;

    var mchc = (v.hb * 100) / v.hct;
    return { out: [{ l: 'VEM (MCV)', v: mcv, u: 'fL', dp: 1, bands: [[-Infinity, 80, 'warn', 'Microcitoză', '', '< 80'], [80, 100, 'ok', 'Normocitoză', '', '80-100'], [100, Infinity, 'warn', 'Macrocitoză', '', '> 100']] },
      { l: 'HEM (MCH)', v: mch, u: 'pg', dp: 1 }, { l: 'CHEM (MCHC)', v: mchc, u: 'g/dL', dp: 1 }] };
  },
  'VEM = hematocrit(%) × 10 / eritrocite (×10¹²/L). HEM = hemoglobină(g/dL) × 10 / eritrocite. CHEM = hemoglobină(g/dL) × 100 / hematocrit(%).');

A('hem', 'ganzoni', 'Deficitul de fier (formula Ganzoni)', 'anemie feripriva deficit fier perfuzie',
  'Estimează deficitul total de fier pentru dozarea suplimentării intravenoase.',
  [N('w', 'Greutate', { u: U.kg, min: 20, max: 200 }), N('hbtarget', 'Hemoglobină țintă', { u: U.hb, min: 8, max: 16 }), N('hbactual', 'Hemoglobină actuală', { u: U.hb, min: 3, max: 16 }),
   N('depot', 'Fier de depozit', { u: 'mg', min: 0, max: 1000, opt: true, hint: 'Implicit 500 mg dacă greutatea este 35 kg sau peste' })],
  function (v) {
    var depot = isFinite(v.depot) ? v.depot : (v.w >= 35 ? 500 : v.w * 15);
    var deficit = v.w * (v.hbtarget - v.hbactual) * 2.4 + depot;
    return { out: [B(O('Deficit total de fier', deficit, 'mg', 0))],
      notes: [['info', 'Fierul de depozit implicit este de 500 mg la 35 kg sau peste, respectiv 15 mg/kg sub această greutate, conform formulei originale.']] };
  },
  'Deficit de fier (mg) = greutate (kg) × (Hb țintă − Hb actuală, g/dL) × 2,4 + fier de depozit (Ganzoni, 1970).');

A('hem', 'volum_sanguin', 'Volumul sanguin estimat', 'volum sanguin total Nadler transfuzie',
  'Estimarea volumului sanguin total, utilă pentru calculul pierderilor sau al transfuziei.',
  [SEX, N('h', 'Înălțime', { u: U.cm, min: 100, max: 220 }), N('w', 'Greutate', { u: U.kg, min: 20, max: 250 })],
  function (v) {
    var hM = v.h / 100, m = v.sex === 'm';
    var vol = m ? (0.3669 * Math.pow(hM, 3) + 0.03219 * v.w + 0.6041) : (0.3561 * Math.pow(hM, 3) + 0.03308 * v.w + 0.1833);
    return { out: [B(O('Volum sanguin total estimat', vol, 'L', 2)), { l: 'Pe kilogram', v: vol * 1000 / v.w, u: 'mL/kg', dp: 0 }] };
  },
  'Formula Nadler: bărbați, 0,3669 × înălțime(m)³ + 0,03219 × greutate(kg) + 0,6041; femei, 0,3561 × înălțime(m)³ + 0,03308 × greutate(kg) + 0,1833.');

A('hem', 'transfuzie', 'Creșterea estimată a hemoglobinei după transfuzie', 'masa eritrocitara transfuzie hemoglobina',

A('ped', 'varsta_corectata', 'Vârsta corectată pentru prematuritate', 'prematur varsta corectata dezvoltare',

  function (v) {

A('uro', 'prostata_volum', 'Volumul prostatei (formula elipsoidului)', 'ecografie prostata volum PSA densitate',
  'Estimarea volumului prostatei din trei diametre ecografice, și densitatea PSA dacă este disponibilă.',
  [N('l', 'Diametru longitudinal', { u: 'cm', min: 1, max: 15 }), N('w', 'Diametru transversal (lățime)', { u: 'cm', min: 1, max: 15 }), N('h', 'Diametru anteroposterior (înălțime)', { u: 'cm', min: 1, max: 15 }),

A('doz', 'rata_perfuzie', 'Rata de perfuzie dintr-o doză țintă', 'perfuzie continua mcg/kg/min seringa automata doza',
  'Convertește o doză țintă (µg/kg/min sau µg/min) într-un ritm de perfuzie (mL/oră), pentru o soluție de concentrație cunoscută.',
  [N('conc_mg', 'Cantitatea de substanță din soluție', { u: 'mg', min: 0.01, max: 5000 }), N('vol', 'Volumul total al soluției', { u: 'mL', min: 1, max: 1000 }),
   S('mode', 'Mod de dozare', [['wk', 'µg/kg/min (necesită greutatea)'], ['k', 'µg/kg/oră (necesită greutatea)'], ['nowk', 'µg/min (fără greutate)'], ['mgh', 'mg/oră (fără greutate)']], { sc: false }),
   N('w', 'Greutate', { u: U.kg, min: 1, max: 300, opt: true, hint: 'Necesară doar pentru dozare pe kilogram' }),
   N('dose', 'Doza țintă (în unitatea selectată mai sus)', { u: '', min: 0.001, max: 10000 })],
  function (v) {
    var concMcgPerML = (v.conc_mg * 1000) / v.vol;
    var mcgPerMin;
    if (v.mode === 'wk') mcgPerMin = v.dose * v.w;
    else if (v.mode === 'k') mcgPerMin = (v.dose * v.w) / 60;
    else if (v.mode === 'nowk') mcgPerMin = v.dose;
    else mcgPerMin = (v.dose * 1000) / 60;
    var rateMlH = (mcgPerMin * 60) / concMcgPerML;
    return { out: [{ l: 'Concentrația soluției', v: concMcgPerML, u: 'µg/mL', dp: 1 }, B(O('Rata de perfuzie', rateMlH, 'mL/oră', 2))],
      notes: [['info', 'Verificați întotdeauna rezultatul cu un al doilea calcul independent înainte de a programa o seringă automată sau o pompă de perfuzie, mai ales pentru substanțe vasoactive cu fereastră terapeutică îngustă.']] };
  },
  'Concentrație (µg/mL) = cantitatea de substanță (mg) × 1000 / volumul soluției (mL). Rata (mL/oră) = doza în µg/min × 60 / concentrația în µg/mL. Dozele pe kilogram se înmulțesc întâi cu greutatea.');

A('doz', 'picaturi', 'Rata de picurare (gtt/min)', 'perfuzie gravitationala picurator debit',
  'Convertește un volum și un timp de administrare într-un ritm de picurare, pentru perfuzia gravitațională.',
  [N('vol', 'Volum de administrat', { u: 'mL', min: 1, max: 5000 }), N('time', 'Timp de administrare', { u: 'minute', min: 1, max: 1440 }),
   S('factor', 'Factorul picurătorului', [[20, '20 picături/mL (macropicurător, standard)'], [15, '15 picături/mL'], [10, '10 picături/mL'], [60, '60 picături/mL (micropicurător)']], { sc: false })],
  function (v) {
    var rate = (v.vol * v.factor) / v.time;
    return { out: [B(O('Ritm de picurare', rate, 'picături/min', 0)), { l: 'Ritm echivalent', v: v.vol / (v.time / 60), u: 'mL/oră', dp: 1 }] };
  },
  'Picături/minut = (volum în mL × factorul picurătorului) / timp în minute.');

A('doz', 'dilutie', 'Diluție (C1V1 = C2V2)', 'dilutie concentratie solutie preparare',
  'Calculează volumul necesar dintr-o soluție stoc pentru a obține o concentrație și un volum final dorite.',
  [N('c1', 'Concentrația soluției stoc', { u: '', min: 0.001, max: 10000 }), N('c2', 'Concentrația finală dorită', { u: '', min: 0.001, max: 10000 }), N('v2', 'Volumul final dorit', { u: 'mL', min: 0.1, max: 5000 })],

      notes: [['info', 'Concentrațiile trebuie exprimate în aceeași unitate pentru C1 și C2 (de exemplu ambele în mg/mL sau ambele procentual).']] };

cat('conv', 'Convertoare de unități');

A('conv', 'convertor_lab', 'Convertor de unități pentru analize de laborator', 'conversie unitati SI conventionale mg/dL mmol/L',
  'Conversie între unități convenționale și unități SI pentru cei mai frecvenți parametri de laborator.',
  [S('param', 'Parametru', [['glu', 'Glicemie'], ['urea', 'Uree'], ['cr', 'Creatinină'], ['bili', 'Bilirubină'], ['ca', 'Calciu'], ['chol', 'Colesterol'], ['tg', 'Trigliceride'], ['hb', 'Hemoglobină'], ['alb', 'Albumină'], ['fe', 'Fier'], ['ucr', 'Creatinină urinară']], { sc: false }),
   N('val', 'Valoarea de convertit', { u: '', min: -1000, max: 100000 }),
   S('dir', 'Unitatea valorii introduse mai sus', [['conv', 'Prima unitate din lista parametrului ales (de exemplu mg/dL pentru majoritatea, mmol/L pentru uree)'], ['si', 'A doua unitate din listă (de exemplu mmol/L sau µmol/L pentru majoritatea, mg/dL pentru uree)']], { sc: false })],
  function (v) {
    var tables = { glu: U.glu, urea: U.urea, cr: U.cr, bili: U.bili, ca: U.ca, chol: U.chol, tg: U.tg, hb: U.hb, alb: U.alb, fe: U.fe, ucr: U.ucr };
    var t = tables[v.param];
    var convU = t[0], siU = t[1];
    // canonical = otherValue * factor + offset; fiecare intrare este [nume, factor, offset?]
    var canonical = v.dir === 'conv' ? v.val : (v.val * siU[1] + (siU[2] || 0));
    var out = [];
    if (v.dir === 'conv') out.push({ l: 'Echivalent în ' + siU[0], v: (canonical - (siU[2] || 0)) / siU[1], u: siU[0], dp: 2, big: true });
    else out.push({ l: 'Echivalent în ' + convU[0], v: canonical, u: convU[0], dp: 2, big: true });
    if (t.length > 2) for (var i = 2; i < t.length; i++) out.push({ l: 'Echivalent în ' + t[i][0], v: (canonical - (t[i][2] || 0)) / t[i][1], u: t[i][0], dp: 2 });
    return { out: out, notes: [['info', 'Factorii de conversie sunt cei standard folosiți în majoritatea laboratoarelor; verificați totuși unitatea raportată de laboratorul dumneavoastră, care poate diferi ocazional.']] };
  },
  'Fiecare parametru folosește factorul de conversie standard între unitățile convenționale (SUA) și unitățile internaționale (SI).');
