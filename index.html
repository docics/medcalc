cat('stat', 'Statistică medicală');

A('stat', 'dg2x2', 'Sensibilitate, specificitate și valori predictive', 'test diagnostic 2x2 VPP VPN raport de probabilitate',
  'Calculează indicii uzuali de performanță ai unui test diagnostic, dintr-un tabel de contingență 2×2.',
  [N('tp', 'Adevărat pozitiv (test pozitiv, boală prezentă)', { u: '', min: 0, max: 1000000 }), N('fp', 'Fals pozitiv (test pozitiv, boală absentă)', { u: '', min: 0, max: 1000000 }),
   N('fn', 'Fals negativ (test negativ, boală prezentă)', { u: '', min: 0, max: 1000000 }), N('tn', 'Adevărat negativ (test negativ, boală absentă)', { u: '', min: 0, max: 1000000 })],
  function (v) {
    var sens = v.tp / (v.tp + v.fn), spec = v.tn / (v.tn + v.fp);
    var ppv = v.tp / (v.tp + v.fp), npv = v.tn / (v.tn + v.fn);
    var acc = (v.tp + v.tn) / (v.tp + v.fp + v.fn + v.tn);
    var lrpos = sens / (1 - spec), lrneg = (1 - sens) / spec;
    return { out: [B(O('Sensibilitate', sens * 100, '%', 1)), { l: 'Specificitate', v: spec * 100, u: '%', dp: 1 },
      { l: 'Valoare predictivă pozitivă', v: ppv * 100, u: '%', dp: 1 }, { l: 'Valoare predictivă negativă', v: npv * 100, u: '%', dp: 1 },
      { l: 'Exactitate (acuratețe)', v: acc * 100, u: '%', dp: 1 }, { l: 'Raport de probabilitate pozitiv', v: lrpos, u: '', dp: 2 }, { l: 'Raport de probabilitate negativ', v: lrneg, u: '', dp: 2 }],
      notes: [['info', 'Valorile predictive depind de prevalența bolii în populația testată (aici, prevalența implicită din eșantionul introdus); pot diferi în alte populații cu prevalență diferită.']] };
  },
  'Sensibilitate = TP/(TP+FN). Specificitate = TN/(TN+FP). VPP = TP/(TP+FP). VPN = TN/(TN+FN). Raport de probabilitate pozitiv = sensibilitate/(1−specificitate). Raport de probabilitate negativ = (1−sensibilitate)/specificitate.');

A('stat', 'nnt', 'NNT și NNH (numărul necesar de tratat)', 'reducere risc absoluta NNT NNH studii clinice',
  'Numărul necesar de tratat pentru a preveni (sau a cauza) un eveniment suplimentar, dintr-un studiu clinic.',
  [N('cer', 'Rata evenimentului în grupul de control', { u: '%', min: 0, max: 100 }), N('eer', 'Rata evenimentului în grupul experimental', { u: '%', min: 0, max: 100 })],
  function (v) {
    var arr = Math.abs(v.cer - v.eer);
    var better = v.eer < v.cer;
    var out = [B(O('Diferența absolută de risc', arr, 'puncte procentuale', 1))];
    if (arr === 0) out.push({ l: 'NNT / NNH', s: 'Nu se poate calcula: nu există o diferență de risc între cele două grupuri.' });
    else out.push({ l: better ? 'NNT (numărul necesar de tratat pentru a preveni un eveniment)' : 'NNH (numărul necesar pentru a cauza un eveniment suplimentar)', v: 100 / arr, u: 'pacienți', dp: 1, big: true });
    return { out: out };
  },
  'Reducerea absolută a riscului (RAR) = |rata în grupul de control − rata în grupul experimental|. NNT = 1 / RAR (RAR exprimat ca fracție), aici calculat din procente ca 100 / RAR(%).');

/* ===== Interfață ===== */
(function () {
  'use strict';
  var NBSP = '\u00a0';
  function $(s, r) { return (r || document).querySelector(s); }
  function h(tag, a, kids) {
    var e = document.createElement(tag), k, v;
    if (a) for (k in a) {
      v = a[k]; if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  var LS = {
    get: function (k, d) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  };
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function group(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP); }
  function fnum(x, dp) {
    var s = nf(x, dp);
    var m = /^(-?)(\d+)(,\d+)?$/.exec(s);
    return m && m[2].length > 4 ? m[1] + group(m[2]) + (m[3] || '') : s;
  }
  function num(s) {
    s = String(s || '').replace(/\s/g, '').replace(',', '.');
    if (s === '') return NaN;
    var x = Number(s); return isFinite(x) ? x : NaN;
  }

  var ALL = [];
  CATS.forEach(function (c) { c.items.forEach(function (it) { it._n = norm(it.title + ' ' + (it.tags || '') + ' ' + c.name + ' ' + (it.desc || '')); ALL.push(it); }); });

  var STATE = {}, fav = LS.get('cm:fav', []), rec = LS.get('cm:rec', []);
  var main = $('#main'), nav = $('#nav'), q = $('#q'), dock = $('#dock');
  var current = null, prevPos = {}, lastR = null;

  /* ---------- Navigare ---------- */
  function buildNav() {
    nav.textContent = '';
    CATS.forEach(function (c) {
      var ul = h('ul', { id: 'ul-' + c.id, hidden: true }, c.items.map(function (it) {
        return h('li', null, [h('a', { href: '#/' + it.id, 'data-id': it.id, text: it.title })]);
      }));
      var btn = h('button', { type: 'button', class: 'ch', 'aria-expanded': 'false', 'aria-controls': 'ul-' + c.id, onclick: function () { toggleCat(c.id); } },
        [h('span', { text: c.name }), h('span', { class: 'ct', text: String(c.items.length) })]);
      nav.appendChild(h('div', { class: 'cat', 'data-c': c.id }, [btn, ul]));
    });
  }
  function toggleCat(id, force) {
    var d = $('.cat[data-c="' + id + '"]', nav); if (!d) return;
    var b = $('.ch', d), u = $('ul', d), open = force != null ? force : b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', open ? 'true' : 'false'); u.hidden = !open;
  }
  function markNav(id) {
    Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-id') === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (id && BYID[id]) toggleCat(BYID[id].cid, true);
  }
  function closeNav() { document.body.classList.remove('navopen'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }

  function route() {
    var m = /^#\/([\w-]+)$/.exec(location.hash), id = m && BYID[m[1]] ? m[1] : null;
    q.value = ''; closeNav();
    if (id) showCalc(BYID[id]); else showHome();
    markNav(id);
    window.scrollTo(0, 0);
    var t = $('h1', main); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
  }

  function linkList(items) {
    return h('ul', { class: 'idx' }, items.map(function (it) {
      return h('li', null, [h('a', { href: '#/' + it.id, text: it.title })]);
    }));
  }
  function showHome() {
    current = null; dock.hidden = true; document.title = 'Calculatoare medicale';
    var n = ALL.length;
    main.textContent = '';
    main.appendChild(h('h1', { text: 'Calculatoare medicale' }));
    main.appendChild(h('p', { class: 'lead', text: n + ' calculatoare în ' + CATS.length + ' categorii. Caută după nume în câmpul de sus sau alege din cuprins.' }));
    var f = fav.filter(function (i) { return BYID[i]; }).map(function (i) { return BYID[i]; });
    var r = rec.filter(function (i) { return BYID[i] && fav.indexOf(i) < 0; }).slice(0, 6).map(function (i) { return BYID[i]; });
    if (f.length) main.appendChild(h('section', { class: 'blk' }, [h('h2', { text: 'Favorite' }), linkList(f)]));
    if (r.length) main.appendChild(h('section', { class: 'blk' }, [h('h2', { text: 'Folosite recent' }), linkList(r)]));
    var cols = h('div', { class: 'cols' });
    CATS.forEach(function (c) {
      cols.appendChild(h('section', { class: 'blk' }, [h('h2', null, [c.name, h('span', { class: 'ct', text: String(c.items.length) })]), linkList(c.items)]));
    });
    main.appendChild(cols);
    main.appendChild(disclaimer());
  }
  function disclaimer() {
    return h('p', { class: 'disc', text: 'Instrumente de ajutor pentru calcul. Rezultatul nu înlocuiește judecata clinică și trebuie confruntat cu sursa clinică înainte de a fi folosit la un pacient.' });
  }
  function showSearch(text) {
    var words = norm(text).split(/\s+/).filter(Boolean);
    var hits = ALL.filter(function (it) { return words.every(function (w) { return it._n.indexOf(w) >= 0; }); });
    hits.sort(function (a, b) {
      var ta = words.every(function (w) { return norm(a.title).indexOf(w) >= 0; }) ? 0 : 1, tb = words.every(function (w) { return norm(b.title).indexOf(w) >= 0; }) ? 0 : 1;
      return ta - tb;
    });
    current = null; dock.hidden = true;
    main.textContent = '';
    main.appendChild(h('h1', { text: hits.length ? 'Rezultate pentru "' + text.trim() + '"' : 'Niciun rezultat' }));
    if (!hits.length) main.appendChild(h('p', { class: 'lead', text: 'Nimic pentru "' + text.trim() + '". Încearcă un nume scurt, de exemplu "MELD", "clearance" sau "Wells".' }));
    var ul = h('ul', { class: 'hits' }, hits.map(function (it) {
      return h('li', null, [h('a', { href: '#/' + it.id }, [h('span', { class: 'ht', text: it.title }), h('span', { class: 'hc', text: it.cname }), h('span', { class: 'hd', text: it.desc || '' })])]);
    }));
    main.appendChild(ul);
  }

  /* ---------- Calculator ---------- */
  function unitOf(f, st) {
    if (Array.isArray(f.u)) { var u = f.u[st.units[f.k] || 0]; return { f: u[1], o: u[2] || 0, name: u[0] }; }
    return { f: 1, o: 0, name: f.u || '' };
  }
  function showCalc(spec) {
    current = spec; document.title = spec.title + ' | Calculatoare medicale';
    var st = STATE[spec.id] || (STATE[spec.id] = { vals: {}, units: {} });
    rec = [spec.id].concat(rec.filter(function (i) { return i !== spec.id; })).slice(0, 12); LS.set('cm:rec', rec);
    var refs = {}, ver = 0;
    main.textContent = '';

    var starBtn = h('button', { type: 'button', class: 'btn', 'aria-pressed': fav.indexOf(spec.id) >= 0 ? 'true' : 'false', onclick: function () {
      var i = fav.indexOf(spec.id); if (i >= 0) fav.splice(i, 1); else fav.push(spec.id);
      LS.set('cm:fav', fav); starBtn.setAttribute('aria-pressed', i >= 0 ? 'false' : 'true'); starBtn.textContent = i >= 0 ? 'Adaugă la favorite' : 'În favorite';
    }, text: fav.indexOf(spec.id) >= 0 ? 'În favorite' : 'Adaugă la favorite' });
    var copyBtn = h('button', { type: 'button', class: 'btn', text: 'Copiază rezultatul', onclick: function () { copyResult(spec, copyBtn); } });
    var resetBtn = h('button', { type: 'button', class: 'btn', text: 'Golește câmpurile', onclick: function () { STATE[spec.id] = null; prevPos = {}; showCalc(spec); $('h1', main).focus({ preventScroll: true }); } });

    main.appendChild(h('p', { class: 'crumb' }, [h('a', { href: '#/', text: 'Toate calculatoarele' }), ' / ', spec.cname]));
    main.appendChild(h('h1', { text: spec.title }));
    if (spec.desc) main.appendChild(h('p', { class: 'lead', text: spec.desc }));
    main.appendChild(h('div', { class: 'acts' }, [starBtn, copyBtn, resetBtn]));

    var form = h('form', { class: 'sheet', novalidate: true, autocomplete: 'off', onsubmit: function (e) { e.preventDefault(); } });
    var fs = h('div', { class: 'flds' });
    spec.fields.forEach(function (f) { fs.appendChild(buildField(spec, f, st, refs, update)); });
    form.appendChild(fs);
    var res = h('div', { class: 'res', id: 'res', 'aria-live': 'polite', 'aria-label': 'Rezultat' });
    main.appendChild(h('div', { class: 'work' }, [form, res]));

    var det = h('details', { class: 'fx' }, [h('summary', { text: 'Formulă și note' }), h('p', { text: spec.formula || 'Formula nu este detaliată pentru acest calculator.' })]);
    main.appendChild(det);
    main.appendChild(disclaimer());

    function read() {
      var v = {};
      spec.fields.forEach(function (f) {
        if (f.t === 'h') return;
        var r = refs[f.k];
        if (f.t === 'n') { var x = num(r.inp.value), u = unitOf(f, st); v[f.k] = isFinite(x) ? x * u.f + u.o : NaN; }
        else if (f.t === 's') {
          var iv = r.get(); v[f.k] = iv === '' || iv == null ? null : f.o[+iv][0];
        }
        else if (f.t === 'c') v[f.k] = r.inp.checked;
        else if (f.t === 'd') v[f.k] = parseYMD(r.inp.value);
        else if (f.t === 'x') v[f.k] = r.inp.value;
      });
      return v;
    }
    function snapshot() {
      spec.fields.forEach(function (f) {
        if (f.t === 'h') return; var r = refs[f.k];
        st.vals[f.k] = f.t === 'c' ? r.inp.checked : (f.t === 's' ? r.get() : r.inp.value);
      });
    }
    function update() {
      var v = read(), errs = 0;
      spec.fields.forEach(function (f) {
        if (f.t === 'h') { return; }
        var r = refs[f.k], vis = isVisible(f, v);
        r.box.hidden = !vis;
        if (f.t === 'n') {
          var msg = '';
          if (vis && isFinite(v[f.k]) && ((f.min != null && v[f.k] < f.min) || (f.max != null && v[f.k] > f.max))) {
            var u = unitOf(f, st), lo = f.min != null ? nf((f.min - u.o) / u.f, 2) : '', hi = f.max != null ? nf((f.max - u.o) / u.f, 2) : '';
            msg = 'Valoare improbabilă. Intervalul acceptat este ' + lo + ' - ' + hi + (u.name ? ' ' + u.name : '') + '.'; errs++;
          }
          r.err.textContent = msg; r.inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
        }
      });
      // anteturile de secțiune dispar dacă toate câmpurile lor sunt ascunse
      snapshot();
      var out = errs ? { badinput: true } : runCalc(spec, v);
      lastR = out; renderResult(res, spec, out);
    }
    update();
  }

  function buildField(spec, f, st, refs, onchange) {
    var id = 'f-' + spec.id + '-' + f.k, saved = st.vals[f.k], box, ref = {};
    if (f.t === 'h') { box = h('h3', { class: 'fh', text: f.l }); if (f.w) { refs['__h' + f.l] = null; } return box; }
    box = h('div', { class: 'f f-' + f.t });
    ref.box = box; refs[f.k] = ref;
    if (f.t === 'n') {
      var inp = h('input', { id: id, type: 'text', inputmode: 'decimal', autocomplete: 'off', spellcheck: 'false', 'aria-describedby': id + '-e', oninput: onchange });
      if (saved != null) inp.value = saved;
      var unit;
      if (Array.isArray(f.u)) {
        unit = h('select', { class: 'u', 'aria-label': 'Unitate pentru ' + f.l.toLowerCase() }, f.u.map(function (u, i) { return h('option', { value: String(i), text: u[0] }); }));
        unit.value = String(st.units[f.k] || 0);
        unit.addEventListener('change', function () {
          var old = st.units[f.k] || 0, nw = +unit.value, o1 = f.u[old], o2 = f.u[nw], x = num(inp.value);
          if (isFinite(x)) {
            var canon = x * o1[1] + (o1[2] || 0), disp = (canon - (o2[2] || 0)) / o2[1];
            inp.value = String(+disp.toPrecision(5)).replace('.', ',');
          }
          st.units[f.k] = nw; onchange();
        });
      } else if (f.u) unit = h('span', { class: 'u', text: f.u });
      box.appendChild(h('label', { for: id, text: f.l }));
      box.appendChild(h('div', { class: 'ln' }, [inp, unit]));
      if (f.hint) box.appendChild(h('p', { class: 'hint', text: f.hint }));
      ref.err = h('p', { class: 'err', id: id + '-e', role: 'alert' }); box.appendChild(ref.err);
      ref.inp = inp;
    } else if (f.t === 's') {
      var labelsLen = f.o.reduce(function (a, o) { return a + String(o[1]).length; }, 0);
      var radio = f.o.length <= 3 && labelsLen <= 34 && f.o.every(function (o) { return String(o[1]).length <= 16; });
      var init = saved != null ? saved : (f.req ? '' : '0');
      if (radio) {
        var fset = h('fieldset', { class: 'seg' }, [h('legend', { text: f.l })]), row = h('div', { class: 'segrow' });
        f.o.forEach(function (o, i) {
          var rb = h('input', { type: 'radio', name: id, id: id + '-' + i, value: String(i), onchange: onchange });
          if (String(init) === String(i)) rb.checked = true;
          row.appendChild(rb); row.appendChild(h('label', { for: id + '-' + i, text: o[1] }));
        });
        fset.appendChild(row); box.appendChild(fset);
        ref.get = function () { var c = fset.querySelector('input:checked'); return c ? c.value : ''; };
        ref.inp = fset;
      } else {
        var sel = h('select', { id: id, onchange: onchange });
        if (f.req) sel.appendChild(h('option', { value: '', text: 'Alege' }));
        f.o.forEach(function (o, i) { sel.appendChild(h('option', { value: String(i), text: o[1] })); });
        sel.value = String(init);
        box.appendChild(h('label', { for: id, text: f.l })); box.appendChild(h('div', { class: 'ln' }, [sel]));
        ref.get = function () { return sel.value; }; ref.inp = sel;
      }
      if (f.hint) box.appendChild(h('p', { class: 'hint', text: f.hint }));
    } else if (f.t === 'c') {
      var cb = h('input', { type: 'checkbox', id: id, onchange: onchange });
      if (saved === true) cb.checked = true;
      var lab = h('label', { class: 'k', for: id }, [cb, h('span', { class: 'kt', text: f.l })]);
      if (spec.score && f.p) lab.appendChild(h('span', { class: 'kp', text: (f.p > 0 ? '+' : '-') + Math.abs(f.p) }));
      box.appendChild(lab); ref.inp = cb;
      if (f.hint) box.appendChild(h('p', { class: 'hint', text: f.hint }));
    } else if (f.t === 'd') {
      var di = h('input', { id: id, type: 'date', oninput: onchange, onchange: onchange });
      if (saved != null) di.value = saved;
      box.appendChild(h('label', { for: id, text: f.l })); box.appendChild(h('div', { class: 'ln' }, [di]));
      if (f.hint) box.appendChild(h('p', { class: 'hint', text: f.hint }));
      ref.inp = di;
    } else if (f.t === 'x') {
      var ta = h('textarea', { id: id, rows: 5, spellcheck: 'false', oninput: onchange, placeholder: f.ph || '' });
      if (saved != null) ta.value = saved;
      box.appendChild(h('label', { for: id, text: f.l })); box.appendChild(ta);
      if (f.hint) box.appendChild(h('p', { class: 'hint', text: f.hint }));
      ref.inp = ta;
    }
    return box;
  }

  /* ---------- Rezultate ---------- */
  function markerPos(b, i, x) {
    var n = b.length, lo = b[i][0], hi = b[i][1], t = 0.5;
    if (isFinite(lo) && isFinite(hi) && hi > lo) t = clamp((x - lo) / (hi - lo), 0.08, 0.92);
    return (i + t) / n * 100;
  }
  function renderOut(o, idx, sink) {
    var tone = o.tone || 'info', sec = h('section', { class: 'o' + (o.big ? ' big' : '') });
    sec.appendChild(h('h3', { class: 'ol', text: o.l }));
    if (o.s != null && o.v == null) {
      sec.appendChild(h('p', { class: 'ov txt tone-' + tone, text: o.s })); sink.push(o.l + ': ' + o.s); return sec;
    }
    var val = fnum(o.v, o.dp), line = h('p', { class: 'ov' }, [h('span', { class: 'n', text: val })]);
    if (o.u) line.appendChild(h('span', { class: 'u', text: ' ' + o.u }));
    sec.appendChild(line);
    var txt = o.l + ': ' + val + (o.u ? ' ' + o.u : '');
    if (o.bands && isFinite(o.v)) {
      var i = pick(o.bands, o.v), bd = o.bands[i];
      sec.appendChild(h('p', { class: 'oi' }, [h('span', { class: 'tag tone-' + bd[2], text: bd[3] }), bd[4] ? ' ' + bd[4] : '']));
      txt += ' (' + bd[3] + ')';
      if (o.bands.length > 1) {
        var ruler = h('div', { class: 'ruler', 'aria-hidden': 'true' }), mk = h('span', { class: 'mk' });
        o.bands.forEach(function (b, j) { ruler.appendChild(h('span', { class: 'seg tone-' + b[2] + (j === i ? ' on' : '') })); });
        var target = markerPos(o.bands, i, o.v), from = prevPos[idx] != null ? prevPos[idx] : target;
        mk.style.left = from + '%'; ruler.appendChild(mk); sec.appendChild(ruler);
        if (from !== target) requestAnimationFrame(function () { requestAnimationFrame(function () { mk.style.left = target + '%'; }); });
        prevPos[idx] = target;
        var ul = h('ul', { class: 'bl' }, o.bands.map(function (b, j) {
          return h('li', { class: j === i ? 'on' : null }, [h('span', { class: 'br', text: rangeLabel(b, o.ints) }), h('span', { class: 'bn', text: b[3] })]);
        }));
        sec.appendChild(h('details', { class: 'bands' }, [h('summary', { text: 'Toate intervalele' }), ul]));
      }
    } else if (o.txt) {
      sec.appendChild(h('p', { class: 'oi' }, [h('span', { class: 'tag tone-' + tone, text: o.txt })])); txt += ' (' + o.txt + ')';
    }
    sink.push(txt);
    return sec;
  }
  function renderResult(res, spec, r) {
    res.textContent = '';
    res.className = 'res';
    var sink = [];
    if (r.badinput) {
      res.appendChild(h('p', { class: 'wait', text: 'Corectează valorile marcate în formular. Calculul pornește după aceea.' })); dock.hidden = true; lastR = null; return;
    }
    if (r.missing) {
      res.appendChild(h('p', { class: 'wait', text: 'Rezultatul apare după ce completezi: ' + r.missing.join(', ') + '.' })); dock.hidden = true; lastR = null; return;
    }
    if (r.empty) { res.appendChild(h('p', { class: 'wait', text: r.empty })); dock.hidden = true; lastR = null; return; }
    res.classList.add('has');
    r.out.forEach(function (o, i) { res.appendChild(renderOut(o, i, sink)); });
    if (r.contrib && r.contrib.length) {
      res.appendChild(h('details', { class: 'bands' }, [h('summary', { text: 'Cum s-a obținut scorul' }),
        h('ul', { class: 'bl' }, r.contrib.map(function (c) { return h('li', null, [h('span', { class: 'br', text: (c[1] > 0 ? '+' : '') + nf(c[1]) }), h('span', { class: 'bn', text: c[0] })]); }))]));
    }
    if (r.notes && r.notes.length) {
      res.appendChild(h('ul', { class: 'notes' }, r.notes.map(function (n) {
        sink.push(n[1]); return h('li', { class: 'tone-' + n[0], text: n[1] });
      })));
    }
    lastR = { text: spec.title + '\n' + sink.join('\n') };
    var first = r.out[0], b = first && first.bands && isFinite(first.v) ? first.bands[pick(first.bands, first.v)] : null;
    if (first && (first.v != null || first.s != null)) {
      dock.hidden = false;
      dock.textContent = '';
      dock.appendChild(h('span', { class: 'dv', text: first.v != null ? fnum(first.v, first.dp) + (first.u ? ' ' + first.u : '') : first.s }));
      if (b) dock.appendChild(h('span', { class: 'tag tone-' + b[2], text: b[3] }));
      dock.setAttribute('aria-label', 'Rezultat: mergi la detalii');
    }
  }
  function copyResult(spec, btn) {
    var text = lastR ? lastR.text : '';
    if (!text) { btn.textContent = 'Nimic de copiat încă'; setTimeout(function () { btn.textContent = 'Copiază rezultatul'; }, 1800); return; }
    function done(ok) { btn.textContent = ok ? 'Copiat' : 'Copierea a eșuat'; setTimeout(function () { btn.textContent = 'Copiază rezultatul'; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback(text)); });
    else done(fallback(text));
  }
  function fallback(text) {
    var t = h('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } document.body.removeChild(t); return ok;
  }

  /* ---------- Inițializare ---------- */
  function initTheme() {
    var root = document.documentElement, t = LS.get('cm:theme', 'auto'), b = $('#themeBtn');
    function apply() { if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t); b.textContent = t === 'auto' ? 'Temă: automată' : (t === 'light' ? 'Temă: deschisă' : 'Temă: închisă'); }
    b.addEventListener('click', function () { t = t === 'auto' ? 'light' : (t === 'light' ? 'dark' : 'auto'); LS.set('cm:theme', t); apply(); });
    apply();
  }
  buildNav(); initTheme();
  window.addEventListener('hashchange', route);
  q.addEventListener('input', function () { if (q.value.trim()) showSearch(q.value); else route(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var a = $('.hits a', main); if (a) { location.hash = a.getAttribute('href'); } }
    if (e.key === 'Escape') { q.value = ''; route(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  $('#menuBtn').addEventListener('click', function () {
    var open = document.body.classList.toggle('navopen'); this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $('#scrim').addEventListener('click', closeNav);
  dock.addEventListener('click', function () { var r = $('#res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  route();
})();

</script>
